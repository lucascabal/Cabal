<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CABAL TERMINAL</title>
    
    <link rel="stylesheet" href="https://unpkg.com/uplot@1.6.30/dist/uPlot.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --pip-green: #4ade80;
            --pip-bg: #030d06;
            --pip-glow: rgba(74, 222, 128, 0.4);
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--pip-bg);
            color: var(--pip-green);
            font-family: 'VT323', monospace;
            font-size: 22px;
            text-shadow: 0 0 3px var(--pip-glow);
            line-height: 1.2;
            overflow-x: hidden;
            box-shadow: inset 0 0 150px #000;
            min-height: 100vh;
            cursor: crosshair;
        }

        ::selection {
            background: var(--pip-green);
            color: var(--pip-bg);
        }

        /* Scanlines */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%),
                linear-gradient(90deg, rgba(74, 222, 128, 0.05), rgba(0, 0, 0, 0), rgba(74, 222, 128, 0.05));
            background-size: 100% 4px, 4px 100%;
            pointer-events: none;
            z-index: 9999;
            animation: scanline 10s linear infinite;
        }

        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* Screen Flicker */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(74, 222, 128, 0.02);
            pointer-events: none;
            z-index: 9998;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
            80% { opacity: 0.98; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            animation: turn-on 1.5s ease-out;
            position: relative;
            z-index: 10;
        }

        @keyframes turn-on {
            0% { transform: scale(1, 0.001); opacity: 0; filter: brightness(0); }
            30% { transform: scale(1, 0.001); opacity: 1; filter: brightness(2); }
            60% { transform: scale(1, 1); filter: brightness(1.5); }
            100% { transform: scale(1, 1); opacity: 1; filter: brightness(1); }
        }

        /* Typography & Layout */
        h1, h2, h3 {
            font-weight: normal;
            margin: 0 0 1rem 0;
            text-transform: uppercase;
        }
        
        .header {
            border-bottom: 2px solid var(--pip-green);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .box {
            border: 2px solid var(--pip-green);
            padding: 1rem;
            position: relative;
            background: rgba(0, 20, 10, 0.5);
        }

        .box::before {
            content: '+';
            position: absolute; top: -14px; left: -10px; font-size: 24px; background: var(--pip-bg); line-height: 1;
        }
        .box::after {
            content: '+';
            position: absolute; bottom: -14px; right: -10px; font-size: 24px; background: var(--pip-bg); line-height: 1;
        }

        .interactive {
            transition: all 0.1s;
        }
        .interactive:hover {
            background: var(--pip-green);
            color: var(--pip-bg);
            cursor: crosshair;
            text-shadow: none;
        }

        .stat-value {
            font-size: 4rem;
            text-align: center;
            margin: 1rem 0;
        }

        .critical {
            animation: flash-critical 1s infinite;
        }

        @keyframes flash-critical {
            0%, 49% { background: transparent; color: var(--pip-green); }
            50%, 100% { background: var(--pip-green); color: var(--pip-bg); text-shadow: none; }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.2rem;
        }
        th, td {
            text-align: left;
            padding: 0.5rem;
            border-bottom: 1px dashed rgba(74, 222, 128, 0.5);
            text-transform: uppercase;
        }
        th {
            border-bottom: 2px solid var(--pip-green);
        }

        tr.interactive:hover td {
            background: var(--pip-green);
            color: var(--pip-bg);
            text-shadow: none;
        }

        .badge {
            display: inline-block;
            padding: 0 0.5rem;
        }
        .badge-ok {
            background: transparent;
            border: 1px solid var(--pip-green);
        }
        .badge-err {
            background: var(--pip-green);
            color: var(--pip-bg);
            animation: err-blink 0.5s infinite;
        }

        @keyframes err-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Loading */
        .boot {
            max-width: 800px;
            margin: 4rem auto;
            font-size: 1.5rem;
            white-space: pre-wrap;
            position: relative;
            z-index: 10;
        }
        .boot-line {
            opacity: 0;
            animation: type 0.1s forwards;
            margin-bottom: 0.5rem;
        }
        @keyframes type { to { opacity: 1; } }

        .cursor {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* uPlot overrides */
        .uplot { font-family: 'VT323', monospace !important; }
        .u-legend { background: var(--pip-bg) !important; color: var(--pip-green) !important; border: 1px solid var(--pip-green) !important; }
        .u-series { color: var(--pip-green) !important; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { html, render, useState, useEffect, useRef } from 'https://unpkg.com/htm/preact/standalone.module.js';
        import uPlot from 'https://unpkg.com/uplot@1.6.30/dist/uPlot.esm.js';

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioContextClass ? new AudioContextClass() : null;

        const playSound = (type) => {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'hover') {
                // Soft geiger tick
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(50, now);
                gain.gain.setValueAtTime(0.02, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.01);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.01);
            } else if (type === 'click') {
                // "Cajon" / Wooden Box Thud
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.15);

                // Add a bit of noise for the physical impact
                const bufferSize = audioCtx.sampleRate * 0.05;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 800;

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.3, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start(now);
            }
        };

        document.addEventListener('mouseover', (e) => {
            if(e.target.closest('.interactive')) playSound('hover');
        });
        document.addEventListener('mousedown', (e) => {
            if(e.target.closest('.interactive') || e.target.closest('button')) playSound('click');
        });

        const pad = (n) => n.toString().padStart(2, '0');
        const formatTime = (iso) => {
            if (!iso) return "---";
            const d = new Date(iso);
            return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        };

        function Chart({ data }) {
            const chartRef = useRef(null);
            const inst = useRef(null);

            useEffect(() => {
                if (!chartRef.current || !data || !data.PerformanceGraph) return;

                const opts = {
                    width: chartRef.current.clientWidth,
                    height: 200,
                    cursor: { y: false, drag: { x: false, y: false } },
                    series: [
                        {}, 
                        {
                            label: "EXEC/MIN",
                            stroke: "#4ade80", 
                            width: 2,
                            fill: "rgba(74, 222, 128, 0.2)",
                            points: { show: false }
                        }
                    ],
                    axes: [
                        { stroke: "#4ade80", grid: { stroke: "rgba(74, 222, 128, 0.2)", width: 1 }, ticks: { stroke: "#4ade80" } }, 
                        { stroke: "#4ade80", grid: { stroke: "rgba(74, 222, 128, 0.2)", width: 1 }, ticks: { stroke: "#4ade80" } }
                    ],
                    scales: { x: { time: true } }
                };

                const chartData = [
                    data.PerformanceGraph.map(p => p.Timestamp),
                    data.PerformanceGraph.map(p => p.Executions)
                ];

                if (!inst.current) {
                    inst.current = new uPlot(opts, chartData, chartRef.current);
                } else {
                    inst.current.setData(chartData);
                }

                return () => {
                    if (inst.current) {
                        inst.current.destroy();
                        inst.current = null;
                    }
                };
            }, [data]);

            return html`<div ref=${chartRef}></div>`;
        }

        function Dashboard() {
            const [stats, setStats] = useState(null);

            useEffect(() => {
                const fetchStats = () => {
                    fetch(window.location.pathname + '/api/stats')
                        .then(res => res.json())
                        .then(data => setStats(data))
                        .catch(err => console.error(err));
                };
                fetchStats();
                const id = setInterval(fetchStats, 2000);
                return () => clearInterval(id);
            }, []);

            if (!stats) {
                return html`
                    <div class="boot">
                        <div class="boot-line" style="animation-delay: 0.1s">ROBCO INDUSTRIES UNIFIED OPERATING SYSTEM</div>
                        <div class="boot-line" style="animation-delay: 0.3s">COPYRIGHT 2075-2077 ROBCO INDUSTRIES</div>
                        <div class="boot-line" style="animation-delay: 0.5s">-Server 1-</div>
                        <div class="boot-line" style="animation-delay: 0.7s">> SYS_CHK ... OK</div>
                        <div class="boot-line" style="animation-delay: 0.9s">> MEM_CHK ... 640K OK</div>
                        <div class="boot-line" style="animation-delay: 1.1s">> LOAD CABAL.SCHEDULER<span class="cursor">_</span></div>
                    </div>
                `;
            }

            return html`
                <div class="container">
                    <div class="header">
                        <div>
                            <h1>CABAL.OS v1.0</h1>
                            <div>ROBCO TERMINAL INTERFACE</div>
                        </div>
                        <div>UPTIME: OK</div>
                    </div>

                    <div class="grid">
                        <div class="box interactive">
                            <h3>[ ACTIVE_PROTOCOLS ]</h3>
                            <div class="stat-value">${stats.ActiveJobs}</div>
                            <div>STATUS: RUNNING</div>
                        </div>
                        
                        <div class="box interactive">
                            <h3>[ TOTAL_CYCLES ]</h3>
                            <div class="stat-value">${stats.TotalExecutions}</div>
                            <div>OPERATIONS COMPLETED</div>
                        </div>

                        <div class="box interactive ${stats.FailedExecutions > 0 ? 'critical' : ''}">
                            <h3>[ SYS_ERRORS ]</h3>
                            <div class="stat-value">${stats.FailedExecutions}</div>
                            <div>${stats.FailedExecutions > 0 ? 'CRITICAL ALERT' : 'NOMINAL'}</div>
                        </div>
                    </div>

                    <div class="box" style="margin-bottom: 2rem;">
                        <h3>[ PERFORMANCE_TELEMETRY ]</h3>
                        <${Chart} data=${stats} />
                    </div>

                    <div class="grid">
                        <div class="box">
                            <h3>[ PROTOCOL_REGISTRY ]</h3>
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>INT(s)</th>
                                        <th>NEXT_EXEC</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${stats.Jobs.length === 0 ? html`<tr><td colspan="3">NO DATA</td></tr>` : 
                                      stats.Jobs.map(job => html`
                                        <tr class="interactive">
                                            <td>${job.Name}</td>
                                            <td>${job.IntervalSeconds}</td>
                                            <td>${formatTime(job.NextExecution)}</td>
                                        </tr>
                                    `)}
                                </tbody>
                            </table>
                        </div>

                        <div class="box">
                            <h3>[ EXECUTION_LOG ]</h3>
                            <table>
                                <thead>
                                    <tr>
                                        <th>TIME</th>
                                        <th>ID</th>
                                        <th>STATE</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${stats.History.length === 0 ? html`<tr><td colspan="3">NO LOGS</td></tr>` :
                                      stats.History.map(log => html`
                                        <tr class="interactive">
                                            <td>${formatTime(log.ExecutedAt)}</td>
                                            <td>${log.JobName}</td>
                                            <td>
                                                <span class="badge ${log.Status === 'Success' ? 'badge-ok' : 'badge-err'}">
                                                    ${log.Status === 'Success' ? '[OK]' : '[ERR]'}
                                                </span>
                                            </td>
                                        </tr>
                                    `)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        render(html`<${Dashboard} />`, document.getElementById('app'));
    </script>
</body>
</html>
